<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мониторинг почвы</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#000000; --card:#111111; --border:#333333;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8;
    --ok:#22c55e; --warn:#fbbf24; --crit:#ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh;
  }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 26px; color: var(--accent); }
  .header p { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; max-width: 1200px; margin: 0 auto;
  }
  .card {
    background: var(--card); border-radius: 12px;
    padding: 20px; border: 1px solid var(--border);
  }
  .card h3 { font-size: 15px; margin-bottom: 12px; color: var(--muted); font-weight: 500; }
  .temp-big {
    font-size: 64px; font-weight: 700; text-align: center;
    margin: 8px 0; transition: color 0.3s;
  }
  .temp-big.ok   { color: var(--ok); }
  .temp-big.warn { color: var(--warn); }
  .temp-big.crit { color: var(--crit); }
  .sim-info { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .mode { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .chart-container { position: relative; height: 320px; }
  .alerts { max-height: 380px; overflow-y: auto; padding-right: 4px; }
  .alerts::-webkit-scrollbar { width: 6px; }
  .alerts::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .alert-item {
    padding: 10px 12px; border-left: 4px solid var(--muted);
    background: var(--bg); border-radius: 6px; margin-bottom: 8px;
    font-size: 13px; animation: slideIn 0.3s ease-out;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .alert-item.info     { border-color: var(--accent); }
  .alert-item.warning  { border-color: var(--warn); }
  .alert-item.critical { border-color: var(--crit); background: rgba(239,68,68,0.08); }
  .alert-time { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  button {
    background: var(--accent); color: var(--bg); border: none;
    padding: 10px 16px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 600; width: 100%;
  }
  button:hover { background: #22a3d8; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .temp-big { font-size: 48px; }
  }
</style>
</head>
<body>
  <div class="header">
    <h1>Мониторинг почвы</h1>
    <p><span class="status-dot"></span>· 1 минута ≈ 60 симулированных дней</p>
  </div>

  <div class="grid">
    <div class="card">
      <div class="temp-big ok" id="temp-big">--°C</div>
      <div class="sim-info" id="sim-info">Подключение…</div>
      <div class="mode" id="mode">Режим: —</div>
      <div id="irrigation-control" style="margin-bottom: 12px;"></div>
      <button onclick="markHarvest()">Отметить сбор урожая </button>
    </div>
    <div class="card">
      <h3>Журнал событий</h3>
      <div class="alerts" id="alerts">
        <div class="alert-item info">Ожидание данных…</div>
      </div>
    </div>
    <div class="card" style="grid-column: 1 / -1;">
      <h3>Температура почвы (°C)</h3>
      <div class="chart-container"><canvas id="chart"></canvas></div>
    </div>
  </div>

  <script>
    const MAX_POINTS = 400;
    const months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];

    function fmtDate(day) {
      const d = ((day % 365) + 365) % 365;
      let m = Math.floor(d / 30.4);
      if (m > 11) m = 11;
      const dom = Math.floor(d - m * 30.4) + 1;
      return `${dom} ${months[m]}`;
    }

    
    const chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          {
            label: 'Температура (°C)',
            data: [],
            borderColor: '#38bdf8', // Голубой
            backgroundColor: 'rgba(56,189,248,0.05)',
            fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2,
            yAxisID: 'y', // Привязка к левой оси
          },
          {
            label: 'Влажность (%)',
            data: [],
            borderColor: '#22c55e', // Зеленый
            backgroundColor: 'transparent',
            fill: false, tension: 0.35, pointRadius: 0, borderWidth: 2,
            borderDash: [5, 5], // Пунктирная линия для отличия
            yAxisID: 'y1', // Привязка к правой оси
          }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        interaction: { intersect: false, mode: 'index' },
        scales: {
          x: { ticks: { color: '#94a3b8', maxTicksLimit: 10, font: { size: 11 } }, grid: { color: 'rgba(51,65,85,0.5)' } },
          y: { // Левая ось (Температура)
            type: 'linear', display: true, position: 'left',
            ticks: { color: '#38bdf8', font: { size: 11 } }, grid: { color: 'rgba(51,65,85,0.5)' },
            title: { display: true, text: '°C', color: '#38bdf8' }
          },
          y1: { // Правая ось (Влажность)
            type: 'linear', display: true, position: 'right', min: 0, max: 100,
            ticks: { color: '#22c55e', font: { size: 11 } }, grid: { drawOnChartArea: false }, // Не рисуем сетку поверх
            title: { display: true, text: '%', color: '#22c55e' }
          }
        },
        plugins: { legend: { display: true, labels: { color: '#e2e8f0' } } }
      }
    });

    const tempBig = document.getElementById('temp-big');
    const simInfo = document.getElementById('sim-info');
    const modeEl  = document.getElementById('mode');
    const alertsEl = document.getElementById('alerts');
    let alertCount = 0;

    function addAlert(a, timestamp, simDay) {
      if (alertCount === 0) alertsEl.innerHTML = '';
      alertCount++;
      const div = document.createElement('div');
      div.className = 'alert-item ' + (a.level || 'info');
      const time = timestamp ? new Date(timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
      const day  = simDay != null ? ` · ${fmtDate(simDay)}` : '';
      
      
      div.innerHTML = `<div class="alert-time">${time}${day}</div>${a.message}`;
      alertsEl.prepend(div);
      if (alertsEl.children.length > 40) alertsEl.removeChild(alertsEl.lastChild);
    }


    async function markHarvest() {
      await fetch('/harvest', { method: 'POST' });
      alertsEl.innerHTML = '';
      alertCount = 0;
      addAlert({ level: 'info', message: 'Урожай собран. Начинается новый сезон.' }, null, 60);
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${proto}://${location.host}/ws`);

      ws.onopen = () => { simInfo.textContent = 'Ожидание первого отсчёта…'; };

      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type !== 'reading') return;

        const t = msg.temperature;
        const h = msg.humidity;
        tempBig.textContent = t.toFixed(1) + '°C';
        tempBig.className = 'temp-big ' + (t >= 28 ? 'crit' : t >= 20 ? 'warn' : 'ok');
        simInfo.textContent = `Дата: ${fmtDate(msg.sim_day)}`;
        modeEl.textContent = `День ${Math.floor(msg.sim_day)} · режим: ${(msg.alerts && msg.alerts.length) ? 'тревога ' : 'обычный'}`;

        const humInfo = document.getElementById('humidity-info');
        if (humInfo) humInfo.textContent = `Влажность: ${h}%`;

        const controlContainer = document.getElementById('irrigation-control');
        
        if (msg.is_watering) {
          
          controlContainer.innerHTML = `<div style="text-align:center; color:#22c55e; font-weight:bold; padding:12px; background:rgba(34,197,94,0.1); border: 1px solid #22c55e; border-radius:6px;">💧 Идет полив. Почва остывает...</div>`;
        } else {
          
          const btnColor = t >= 28 ? '#ef4444' : '#3b82f6'; 
          const btnText = t >= 28 ? ' ВКЛЮЧИТЬ АВТОПОЛИВ (ЗАСУХА)' : ' ВКЛЮЧИТЬ АВТОПОЛИВ ';
          const btnShadow = t >= 28 ? 'box-shadow: 0 4px 12px rgba(239,68,68,0.3);' : 'box-shadow: 0 4px 12px rgba(59,130,246,0.2);';

          controlContainer.innerHTML = `<button onclick="turnOnIrrigation(this)" style="background:${btnColor}; color:white; border:none; padding:12px; border-radius:6px; width:100%; font-weight:bold; cursor:pointer; font-size:14px; transition: all 0.3s; ${btnShadow}">${btnText}</button>`;
        }

        chart.data.labels.push(fmtDate(msg.sim_day));
        chart.data.datasets[0].data.push(t);
        chart.data.datasets[1].data.push(h);

        if (chart.data.labels.length > MAX_POINTS) {
          chart.data.labels.shift();
          chart.data.datasets[0].data.shift();
          chart.data.datasets[1].data.shift(); 
        }
        chart.update('none');

        (msg.alerts || []).forEach(a => addAlert(a, msg.timestamp, msg.sim_day));
      };

      ws.onclose = () => {
        simInfo.textContent = 'Соединение потеряно, переподключение…';
        setTimeout(connectWS, 2000);
      };
    }

    async function loadHistory() {
      try {
        const res = await fetch('/history?limit=200');
        const data = await res.json();
        data.readings.forEach(r => {
          chart.data.labels.push(fmtDate(r.sim_day));
          chart.data.datasets[0].data.push(r.temperature);
        });
        if (chart.data.labels.length > MAX_POINTS) {
          const excess = chart.data.labels.length - MAX_POINTS;
          chart.data.labels.splice(0, excess);
          chart.data.datasets[0].data.splice(0, excess);
        }
        chart.update('none');
        data.alerts.slice(0, 15).forEach(a => addAlert(a, a.timestamp, a.sim_day));
      } catch (e) { console.warn('history load failed', e); }
    }

    async function turnOnIrrigation(btn) {
      btn.disabled = true;
      btn.textContent = 'Включаем насос...';
      btn.style.background = '#64748b';
      try {
        await fetch('/irrigation/on', { method: 'POST' });
      } catch (e) {
        alert('Ошибка при отправке команды');
      }
    }
    (async () => { await loadHistory(); connectWS(); })();
  </script>
</body>
</html>
